# 1. トラックボール（MX8650）を動かすための必須設定（キープ）
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_SENSOR_MX8650=y

# 2. NFCピン（P0.09 / P0.10）を通常のGPIOとして使う設定（キープ）
CONFIG_NFCT_PINS_AS_GPIOS=y

# 3. BMP Boostの内部システムと衝突する機能を完全にオフにする（エラー修正）
CONFIG_ZMK_USB_LOGGING=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=n
